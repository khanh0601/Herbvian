<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">Herbvian — seed to sprout</title>
<desc id="desc">A seed opens and a loofah vine grows two leaves. A single 1.9 second animation ends on the brand name. Reduced motion shows the final illustration.</desc>
<!-- Inline or use as an img. Animation plays once; the host page controls dismissal after its hero is ready. Wordmark uses a system serif; replace with approved logo paths for exact branding. -->
<style>
:root{--green:#244d38;--cream:#f5f0e7;--sage:#8caa83}
.stem,.vein,.curl{fill:none;stroke:var(--green);stroke-linecap:round;stroke-linejoin:round}
.stem{stroke-width:2.7;stroke-dasharray:1;animation:draw 850ms 200ms both}
.curl{stroke-width:1.3;stroke-dasharray:1;animation:draw 600ms 850ms both}
.leaf{fill:var(--green)}
.left{transform-origin:240px 150px;animation:bloom 650ms 550ms both}
.right{transform-origin:241px 130px;animation:bloom 700ms 750ms both}
.vein{stroke:var(--sage);stroke-width:1.1}
.seedL{animation:openL 650ms 100ms both;transform-origin:240px 203px}
.seedR{animation:openR 650ms 100ms both;transform-origin:240px 203px}
.wordmark{animation:appear 650ms 1150ms both}
.rule{animation:appear 500ms 1400ms both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes bloom{from{opacity:0;transform:scale(.05) rotate(12deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes openL{from{transform:rotate(0)}to{transform:translate(-2px,2px) rotate(-24deg)}}
@keyframes openR{from{transform:rotate(0)}to{transform:translate(2px,2px) rotate(24deg)}}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.stem,.curl,.left,.right,.seedL,.seedR,.wordmark,.rule{animation:none}.seedL{transform:translate(-2px,2px) rotate(-24deg)}.seedR{transform:translate(2px,2px) rotate(24deg)}}
</style>
<rect width="480" height="360" fill="var(--cream)"/>
<path class="stem" pathLength="1" d="M240 205 C236 185 246 175 240 153 C237 140 244 125 246 115"/>
<path class="curl" pathLength="1" d="M242 163 C265 163 277 151 269 144 C262 138 256 147 263 150"/>
<g class="left"><path class="leaf" d="M240 151 C216 155 194 140 192 116 C216 115 240 127 240 151Z"/><path class="vein" d="M236 147 Q214 131 200 123 M218 134 L213 124"/></g>
<g class="right"><path class="leaf" d="M242 132 C240 107 257 87 284 84 C285 109 269 133 242 132Z"/><path class="vein" d="M247 127 Q266 109 277 92 M262 113 L273 110"/></g>
<path class="seedL" fill="#244d38" d="M240 183 C227 186 225 208 240 215Z"/>
<path class="seedR" fill="#45674d" d="M240 183 C253 186 255 208 240 215Z"/>
<text class="wordmark" x="240" y="269" text-anchor="middle" fill="#244d38" font-family="Georgia, 'Times New Roman', serif" font-size="37" letter-spacing=".3">Herbvian</text>
<path class="rule" d="M222 290 H258" stroke="#8caa83" stroke-width="1"/>
</svg>
